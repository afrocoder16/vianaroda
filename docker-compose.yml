services:
  postgres:
    image: postgres:16
    container_name: vinaroda-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: vinaroda
    ports:
      - "5432:5432"
    volumes:
      - vinaroda_pgdata:/var/lib/postgresql/data

volumes:
  vinaroda_pgdata:
